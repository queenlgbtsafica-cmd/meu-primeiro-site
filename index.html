<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site 💖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6ec, #f8c8ff);
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      color: #d63384;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      margin-top: 30px;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      background: #d63384;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>✨ Meu Primeiro Site ✨</h1>

    <div class="card">
      <h2>Bem-vinda! 💖</h2>

      <p>
        Esse é o meu primeiro projeto criado com HTML
        e publicado através do GitHub.
      </p>

      <button onclick="alert('Você conseguiu! 💕')">
        Clique aqui 💗
      </button>
    </div>
  </div>

</body>
</html>
